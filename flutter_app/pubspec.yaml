name: duka_ledger
description: DUKA LEDGER business dashboard app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  geolocator: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/duka-growth-hero.png
    - assets/app_icon.png
    - assets/jengabiz_banner.png
    - assets/jengabiz_mark.png
    - assets/items_db.json
