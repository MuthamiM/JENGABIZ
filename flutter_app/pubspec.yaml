name: duka_ledger
description: DUKA LEDGER business dashboard app.
publish_to: "none"
version: 1.1.15+26

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.1.0
  local_auth: ^2.3.0
  geolocator: 13.0.1
  geocoding: ^3.0.0
  pdf: ^3.11.3
  printing: ^5.14.3
  image: ^4.5.4
  flutter_local_notifications: ^19.5.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  camera: ^0.11.2
  image_picker: 1.1.2
  flutter_contacts: 1.1.9+2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/duka-growth-hero.png
    - assets/app_icon.png
    - assets/jengabiz_banner.png
    - assets/jengabiz_mark.png
    - assets/items_db.json
