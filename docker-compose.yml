version: '3.8'

services:
  # Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: duka_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-dukaledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dukapassword123}
      POSTGRES_DB: ${DB_NAME:-duka_ledger_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaledger -d duka_ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Redis for Caching, Rate Limiting & Queue
  redis:
    image: redis:7-alpine
    container_name: duka_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Python FastAPI Backend
  backend-python:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duka_backend_python
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://dukaledger:dukapassword123@postgres:5432/duka_ledger_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=duka-super-secret-jwt-key-for-scalability-2026
      - SMS_PROVIDER_API_KEY=mock_africastalking_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  # Celery Background Worker (Reminders, SMS, Async Price Aggregation)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duka_celery_worker
    command: celery -A app.features.messaging.celery_worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://dukaledger:dukapassword123@postgres:5432/duka_ledger_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend-python
      - redis

  # Web Frontend (Buyer Portal & Public Shop Pages)
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: duka_frontend_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend-python

  # Nginx Reverse Proxy / Load Balancer (Configured for 3,000+ concurrent connections)
  nginx:
    image: nginx:alpine
    container_name: duka_nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-python
      - frontend-web

volumes:
  postgres_data:
  redis_data:
