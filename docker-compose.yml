services:
  jengabiz-redis:
    image: redis:7-alpine
    container_name: jengabiz-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - jengabiz_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jengabiz-api:
    build:
      context: ./backend-csharp
      dockerfile: Dockerfile
    container_name: jengabiz-api
    restart: unless-stopped
    depends_on:
      jengabiz-redis:
        condition: service_healthy
    expose:
      - "5080"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__SqliteConnection=Data Source=/app/data/duka_ledger.db
      - ConnectionStrings__Redis=jengabiz-redis:6379
      - DatabaseProvider=Sqlite
    volumes:
      - jengabiz_db_data:/app/data

  jengabiz-api-gateway:
    image: nginx:alpine
    container_name: jengabiz-api-gateway
    restart: unless-stopped
    depends_on:
      jengabiz-api:
        condition: service_started
      jengabiz-email-otp:
        condition: service_healthy
    ports:
      - "5080:80"
    volumes:
      - ./deployment/nginx/jengabiz-api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  jengabiz-email-otp:
    image: node:24-alpine
    container_name: jengabiz-email-otp
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    ports:
      - "127.0.0.1:5081:5081"
    environment:
      - PORT=5081
      - DATABASE_PATH=/data/jengabiz.sqlite
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - OTP_HASH_SECRET=${JENGABIZ_OTP_HASH_SECRET:-}
      - FIREBASE_SERVICE_ACCOUNT_FILE=/run/secrets/jengabiz-fcm-service-account.json
    volumes:
      - ./backend/email-otp:/app:ro
      - jengabiz_account_data:/data
      - ./deployment/secrets/jengabiz-fcm-service-account.json:/run/secrets/jengabiz-fcm-service-account.json:ro
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:5081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  jengabiz-landing:
    image: nginx:alpine
    container_name: jengabiz-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:5082:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./deployment/nginx/jengabiz-landing.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  jengabiz_redis_data:
  jengabiz_db_data:
  jengabiz_account_data:

