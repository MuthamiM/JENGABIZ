server:
  port: 8080

spring:
  application:
    name: duka-ledger-api
  datasource:
    url: jdbc:postgresql://localhost:5432/duka_ledger_db
    username: dukaledger
    password: dukapassword123
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
