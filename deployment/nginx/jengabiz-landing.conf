server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Keep app account requests on the landing-page hostname so mobile clients
    # do not depend on a separate API DNS record.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $jengabiz_api_gateway http://jengabiz-api-gateway:80;

    location ^~ /email-auth/ {
        client_max_body_size 40m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_pass $jengabiz_api_gateway;
    }

    location ^~ /catalog/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_pass $jengabiz_api_gateway;
    }

    location ^~ /summary/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_pass $jengabiz_api_gateway;
    }

    location ^~ /sync/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_pass $jengabiz_api_gateway;
    }

    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass $jengabiz_api_gateway;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    # Withdrawn interim build: do not recreate it from origin after the cache
    # copy expires, and prevent an old installer link from caching a 404.
    location ~* ^/downloads/v1\.1\.5/ {
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        add_header Cloudflare-CDN-Cache-Control 'no-store' always;
        add_header X-Content-Type-Options nosniff always;
        return 410;
    }

    location ~* ^/downloads/v[0-9]+\.[0-9]+\.[0-9]+/.+\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="JengaBiz.apk"' always;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="JengaBiz.apk"' always;
        add_header Cache-Control 'public, max-age=300' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.sha256$ {
        default_type text/plain;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /downloads/latest.json {
        default_type application/json;
        add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
        add_header Cloudflare-CDN-Cache-Control 'no-store' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control 'public, max-age=300' always;
        add_header Cloudflare-CDN-Cache-Control 'public, max-age=600, stale-while-revalidate=3600' always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control 'public, max-age=300' always;
        add_header Cloudflare-CDN-Cache-Control 'public, max-age=600, stale-while-revalidate=3600' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* \.js$ {
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        add_header Cloudflare-CDN-Cache-Control 'public, max-age=31536000, stale-while-revalidate=86400' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
